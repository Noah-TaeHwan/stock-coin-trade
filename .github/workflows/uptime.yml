# 공개 서버 수동 점검. HTTPS로 핵심 주소 세 곳을 부르고, 하나라도 실패하면 이 워크플로가 실패한다.
# 상시 감시(5분마다 사이트·매일 백업)는 AWS에서 돈다(infra/cloudformation/stockdesk.yaml의 Monitor* 자원).
# 이 저장소는 포크라 GitHub 예약 실행이 한 번도 돌지 않았다(2026-09-27 확인). 그래서 schedule을 두지 않는다.
name: Uptime

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uptime
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    env:
      SITE_ADDRESS: ${{ vars.SITE_ADDRESS }}
    steps:
      - name: Health, disclosures API, privacy page
        run: |
          set -euo pipefail
          base="https://$SITE_ADDRESS"
          check() {
            local path="$1" expect="$2" code body
            for _ in 1 2 3; do
              body=$(curl -sS --max-time 20 -o - -w '\n%{http_code}' "$base$path" || true)
              code="${body##*$'\n'}"
              if [ "$code" = 200 ] && grep -q -- "$expect" <<<"$body"; then echo "ok $path"; return 0; fi
              sleep 10
            done
            echo "::error::$path failed (last status ${code:-none})"
            return 1
          }
          failed=0
          check /health '"status"' || failed=1
          check /api/disclosures '"attribution"' || failed=1
          check /privacy.html '개인정보 처리방침' || failed=1
          exit "$failed"
