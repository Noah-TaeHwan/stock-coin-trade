# 공개 서버 가동 확인(S5). 30분마다 HTTPS로 핵심 주소를 부르고, 하나라도 실패하면 이 워크플로가 실패한다.
# 하루 한 번(06:45 KST)은 서버의 DB 백업 타이머가 최근 26시간 안에 성공했는지 SSM으로 확인한다.
# 예약 실행이 실패하면 GitHub이 저장소 관리자에게 알림 메일을 보낸다. 추가 비용·외부 서비스 없음.
name: Uptime

on:
  schedule:
    - cron: "7,37 * * * *"
    - cron: "45 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uptime
  cancel-in-progress: true

jobs:
  check:
    if: github.event.schedule != '45 21 * * *'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    env:
      SITE_ADDRESS: ${{ vars.SITE_ADDRESS }}
    steps:
      - name: Health, disclosures API, privacy page
        run: |
          set -euo pipefail
          base="https://$SITE_ADDRESS"
          check() {
            local path="$1" expect="$2" code body
            for _ in 1 2 3; do
              body=$(curl -sS --max-time 20 -o - -w '\n%{http_code}' "$base$path" || true)
              code="${body##*$'\n'}"
              if [ "$code" = 200 ] && grep -q -- "$expect" <<<"$body"; then echo "ok $path"; return 0; fi
              sleep 10
            done
            echo "::error::$path failed (last status ${code:-none})"
            return 1
          }
          failed=0
          check /health '"status"' || failed=1
          check /api/disclosures '"attribution"' || failed=1
          check /privacy.html '개인정보 처리방침' || failed=1
          exit "$failed"

  backup:
    if: github.event.schedule == '45 21 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Last backup succeeded within 26 hours
        run: |
          # shellcheck disable=SC2016 # 이 스크립트는 서버에서 풀려야 하므로 여기서 펼치지 않는다
          script='r=$(systemctl show -p Result --value stockdesk-backup.service); t=$(systemctl show -p ExecMainExitTimestamp --value stockdesk-backup.service); echo "result=$r last=$t"; [ "$r" = success ] && [ -n "$t" ] && [ $(( $(date +%s) - $(date -d "$t" +%s) )) -lt 93600 ]'
          params=$(jq -n --arg s "$script" '{commands: [$s]}')
          command_id=$(aws ssm send-command --instance-ids "$EC2_INSTANCE_ID" --document-name AWS-RunShellScript \
            --comment "backup check" --parameters "$params" --query Command.CommandId --output text)
          for _ in $(seq 1 30); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" \
            --query StandardOutputContent --output text
          if [ "$status" != Success ]; then echo "::error::backup is failing or stale"; exit 1; fi
