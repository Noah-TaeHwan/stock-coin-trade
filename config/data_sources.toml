# 시세 데이터 소스 레지스트리. 어떤 소스를 어떤 프로필에서 쓸 수 있는지의 단일 근거다.
#
# 규칙(tests/policy/test_data_sources.py가 강제한다):
# - public에서 켜려면 status = "verified"이고, redistribution이 "forbidden"·"unknown"이 아니며,
#   attribution(화면 출처 문구)이 있어야 한다.
# - verified로 바꾸는 사람은 약관 원문을 읽고 terms_url, checked_on, checked_by를 채운다.
#   Claude가 약관을 확인했다고 적지 않는다. 약관 확인과 상태 변경은 Noah가 한다.
#
# status: verified | unverified | rejected
# commercial_use / redistribution / modification: allowed | conditional | forbidden | unknown

[sources.synthetic]
name = "합성 시세(결정적 GBM)"
kind = "synthetic"
status = "verified"
terms_url = ""
checked_on = "2026-09-25"
checked_by = "자체 생성 데이터(외부 약관 없음)"
commercial_use = "allowed"
redistribution = "allowed"
modification = "allowed"
attribution = "합성 데이터 — 실제 시세가 아닙니다"
notes = "src/marketdata/sources/synthetic.py. 같은 종목·기간이면 항상 같은 값을 만든다."
enabled = { local = true, public = true }

