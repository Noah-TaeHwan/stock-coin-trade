# USD per million tokens. Source: https://platform.claude.com/docs/en/about-claude/pricing
# (checked 2026-09-26). Columns there: base input, 5m cache write, 1h cache write,
# cache hit, output. Update this file, not the code, when prices change.
checked_on = "2026-09-26"
source = "https://platform.claude.com/docs/en/about-claude/pricing"

# Opus 5.5는 캐시 적중이 기본 입력가의 0.05배다(다른 모델은 0.1배).
[models.claude-opus-5-5]
input = 4.00
cache_write_5m = 5.00
cache_read = 0.20
output = 20.00

# 이전 기록(ai_usage, 재생 스크립트)의 비용 재계산용으로 남긴다.
[models.claude-opus-5]
input = 5.00
cache_write_5m = 6.25
cache_read = 0.50
output = 25.00

[models.claude-sonnet-5]
input = 2.00
cache_write_5m = 2.50
cache_read = 0.20
output = 10.00

[models.claude-haiku-4-5]
input = 1.00
cache_write_5m = 1.25
cache_read = 0.10
output = 5.00

# TypeSafe Jev(자연어 명령 라우터, src/deskjev): 입력만 과금하고 출력은 무료다. 캐시 과금은 없다.
# Source: https://docs.typesafe.ai/models ($0.042 per million input tokens, checked 2026-09-26).
[models."jev-1.13.0"]
input = 0.042
cache_write_5m = 0.0
