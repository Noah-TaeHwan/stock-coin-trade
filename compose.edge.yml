# HTTPS 앞단(Caddy). compose.public.yml 위에 얹는다.
#   SITE_ADDRESS=desk.example.com docker compose -f docker-compose.yml -f compose.public.yml -f compose.edge.yml up -d
# nginx(frontend)는 호스트 포트를 열지 않고 Caddy만 80·443을 연다.
services:
  frontend:
    ports: !reset []
    volumes:
      - ./docker/real-ip.edge.conf:/etc/nginx/snippets/real-ip.conf:ro

  caddy:
    # 2026-09-25 기준 Caddy 최신 릴리스(v2.11.4).
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on:
      - frontend
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS to the public domain}
    ports:
      - "${EDGE_HTTP_PORT:-80}:80"
      - "${EDGE_HTTPS_PORT:-443}:443"
      - "${EDGE_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - internal

volumes:
  caddy-data:
  caddy-config:
