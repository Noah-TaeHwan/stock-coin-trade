# 모든 응답에 붙이는 보안 헤더. nginx는 location 안에 add_header가 하나라도 있으면
# 바깥 add_header를 상속하지 않으므로, add_header를 쓰는 location에서도 이 파일을 include한다.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# 먼저 보고 모드로 둔다. 화면이 CDN 스크립트(Tailwind Play CDN 등)와 인라인 스크립트를
# 쓰므로, 강제 적용은 그 의존성을 정리한 뒤(Phase 6) 결정한다.
add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'" always;
