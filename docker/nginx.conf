server {
    listen 80;
    server_name localhost;
    server_tokens off;

    # 백엔드 주소는 요청마다 Docker 내장 DNS(127.0.0.11)로 다시 푼다. 고정 주소로 두면
    # nginx가 시작할 때 한 번만 풀어 둔 IP를 계속 써서, 백엔드 컨테이너만 새로 만들어
    # IP가 바뀌면 frontend를 재시작하기 전까지 모든 API가 502가 된다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend python-backend:8200;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    # 백엔드 상태를 그대로 전달한다. 예전에는 아래 SPA fallback이 index.html을
    # 200으로 돌려줘서, 백엔드가 죽어도 /health가 정상으로 보였다.
    location = /health {
        proxy_pass         http://$backend/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $http_host;
    }

    # Python BE API 프록시 (같은 origin 처리로 CORS 불필요)
    location /api/ {
        proxy_pass         http://$backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Cookie            $http_cookie;
        proxy_pass_header  Set-Cookie;
        # AI Sheet의 LEAN 백테스트(Docker로 QuantConnect LEAN 엔진 실행)는
        # .NET 콜드 스타트 때문에 기본 60초보다 오래 걸릴 수 있다.
        proxy_read_timeout 200s;
    }

    # Open API (외부 연동, API Key 인증 — 세션 쿠키 불필요)
    location /openapi/ {
        proxy_pass         http://$backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # 업비트 API/웹소켓을 같은 origin으로 중계한다. 브라우저가 업비트에
    # 직접 요청하지 않으므로 운영 도메인에서 CORS 정책에 막히지 않는다.
    location /upbit-api/ {
        rewrite ^/upbit-api/(.*)$ /v1/$1 break;
        proxy_pass         https://api.upbit.com;
        proxy_ssl_server_name on;
        proxy_set_header   Host api.upbit.com;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    location = /upbit-websocket {
        proxy_pass         https://api.upbit.com/websocket/v1;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header   Host api.upbit.com;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        # 업비트가 브라우저 origin을 기준으로 연결을 거부하지 않도록 한다.
        proxy_set_header   Origin "";
    }

    # 메뉴 구조가 바뀌었을 때 이전 common.js가 브라우저에 남지 않게 한다.
    location = /js/common.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # API 키 화면: 새 키가 한 번 보이는 화면이라 스크립트는 이 사이트 파일만 허용한다. 공통 헤더가 쓰는
    # 인라인 스타일과 아이콘 글꼴(cdnjs)은 허용한다(스크립트 주입은 막는다).
    location ~ ^/member/api-keys(\.html)?$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html =404;
    }

    # 인증 화면: 제3자·인라인 스크립트 없이 CSP를 강제한다(S1 스펙 ⑤). 확장자를 생략한 주소도 같은 헤더를 받는다.
    location ~ ^/(member/(login|register|verify|reset-request|reset|account)|privacy)(\.html)?$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html =404;
    }

    # .html 생략 가능 + SPA fallback
    location / {
        # 배포 뒤 옛 화면이 남지 않게 매번 변경 여부를 확인한다(바뀌지 않았으면 304로 가볍게 끝난다).
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ $uri.html /index.html;
    }
}
