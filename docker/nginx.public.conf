# 공개 배포용 nginx 설정(compose.public.yml이 기본 설정 대신 마운트한다).
# 기본 설정(nginx.conf)과 다른 점:
# - /api/, /openapi/에 IP별 요청 제한(limit_req). 초과 시 기본값 503 대신 429.
# - 업비트 REST·WebSocket 중계를 두지 않는다. 모든 방문자 요청이 서버 IP 하나로
#   업비트에 가면 IP 단위 한도에 걸려 차단(418)될 수 있다.
# 앞단에 리버스 프록시(예: Caddy)를 더 두면 $remote_addr이 그 프록시가 되므로,
# 그때는 real_ip 설정과 백엔드 TRUSTED_PROXY_COUNT를 함께 맞춘다.
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=10r/s;

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    location = /health {
        proxy_pass         http://python-backend:8200/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $http_host;
    }

    location /api/ {
        limit_req          zone=api_per_ip burst=40 nodelay;
        limit_req_status   429;
        proxy_pass         http://python-backend:8200;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_read_timeout 60s;
    }

    location /openapi/ {
        limit_req          zone=api_per_ip burst=20 nodelay;
        limit_req_status   429;
        proxy_pass         http://python-backend:8200;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
    }

    location = /js/common.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}
