<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>AI 시장 분석 — 모의투자 — Noah Trading Desk</title><script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css?v=20260926-consent"><style>
    .term-form{display:grid;gap:6px}.term-form :is(input,select,textarea){width:100%;margin:0;padding:5px 8px;border:1px solid var(--border-strong);border-radius:var(--radius-xs);background:var(--bg);color:var(--fg);font:inherit;font-size:12.5px}.term-form :is(input,select){height:28px;padding-top:0;padding-bottom:0}.term-form textarea{resize:vertical;line-height:1.55}.term-form label{color:var(--muted);font-size:11px;font-weight:700}.output{min-height:60vh;padding:10px 14px;color:var(--fg);font-size:13.5px;line-height:1.75}.rag{display:none;margin-top:6px;padding:6px 8px;border:1px solid var(--border);background:var(--surface-2);font-size:12px}
  </style></head><body><div id="header-mount"></div><main class="wide term-page">
    <header class="term-pagehead"><span class="term-code">AI</span><h1>AI 시장 분석</h1><p>시장 맥락과 지식 베이스(Qdrant) 검색 근거를 함께 보며 분석합니다.</p></header>
    <div class="term-layout term-layout--tool">
      <section class="term-panel term-rail">
        <div class="term-panel__bar"><span class="term-code">REQ</span>분석 조건</div>
        <div class="term-panel__body term-panel__body--pad term-form">
          <label for="aiContextSelect">시장</label>
          <select id="aiContextSelect"><option value="general">전체 시장</option><option value="stock">주식 시장</option><option value="crypto">코인 시장</option></select>
          <label for="aiRagLimit">근거 수</label>
          <select id="aiRagLimit"><option value="3">근거 3개</option><option value="5" selected>근거 5개</option><option value="8">근거 8개</option></select>
          <label for="marketContextInput">질문</label>
          <input id="marketContextInput" placeholder="예: 반도체 업종 변동성 점검">
          <button class="term-btn term-btn-primary btn" id="aiRunBtn" onclick="runAiAnalysis()">분석 시작</button>
          <div id="ai-rag-block" class="rag"><b>Qdrant 검색 근거 <span id="rag-hit-count"></span></b><div id="rag-context-list" style="margin-top:6px"></div></div>
        </div>
      </section>
      <section class="term-panel">
        <div class="term-panel__bar"><span class="term-code">OUT</span>분석 결과</div>
        <article id="aiContent" class="output">분석 조건을 입력하고 <strong>분석 시작</strong>을 선택하세요.</article>
      </section>
    </div>
  </main><script src="/js/config.js"></script><script src="/js/common.js?v=20260925-terminal"></script><script>document.addEventListener('DOMContentLoaded',()=>initPage())</script></body></html>
