<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 거래이력 — Noah Trading Desk</title>
  <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
  <style>
    @font-face { font-family:'Pretendard'; font-weight:400; font-display:swap; src:url('/fonts/Pretendard-Regular.woff2') format('woff2'); }
    @font-face { font-family:'Pretendard'; font-weight:600; font-display:swap; src:url('/fonts/Pretendard-SemiBold.woff2') format('woff2'); }
    @font-face { font-family:'Pretendard'; font-weight:700; font-display:swap; src:url('/fonts/Pretendard-Bold.woff2') format('woff2'); }
    @font-face { font-family:'Pretendard'; font-weight:800; font-display:swap; src:url('/fonts/Pretendard-ExtraBold.woff2') format('woff2'); }
    .history-grid { --ag-font-size:12px; }
    .history-grid .ag-header-cell-label { font-weight:800; }
    .history-grid .ag-cell { display:flex; align-items:center; }
  </style>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Pretendard','-apple-system','BlinkMacSystemFont','Segoe UI','Apple SD Gothic Neo','Malgun Gothic','sans-serif']}}}}</script>
  <link rel="stylesheet" href="/css/style.css?v=20260926-consent">
  <script src="https://cdn.jsdelivr.net/npm/ag-grid-community@36.0.2/dist/ag-grid-community.min.js"></script>
</head>
<body class="min-h-screen">
<div id="header-mount"></div>
<main class="history-page term-page">
    <header class="term-pagehead"><span class="term-code">HIST</span><h1>내 거래이력</h1><p>주식·코인·대체자산의 매수·매도 체결 내역을 함께 조회하고 정렬·필터링·CSV 저장을 할 수 있습니다.</p><span class="term-right"><button id="historyRefreshBtn" type="button" class="term-btn">↻ 새로고침</button><button id="historyCsvBtn" type="button" class="term-btn term-btn-primary">CSV 저장</button></span></header>
    <div class="term-kpis">
      <div><small>전체 체결</small><b><span id="historyTotalCount">-</span> <span style="color:var(--muted);font-size:11px;">건</span></b></div>
      <div><small>누적 매수금액</small><b id="historyBuyAmount">-</b></div>
      <div><small>누적 매도금액</small><b id="historySellAmount">-</b></div>
    </div>
    <div class="term-toolbar"><input id="historyQuickFilter" type="search" placeholder="자산 · 종목명 · 종목코드 · 매수/매도 검색"><span id="historyStatus"></span></div>
    <section class="term-panel term-fill" style="min-height:460px;">
      <div class="term-panel__bar"><span class="term-code">FILLS</span>체결 내역<span class="term-sub">주식 · 코인 · 대체자산 · 정렬·필터 가능</span></div>
      <div id="historyGrid" class="history-grid" style="flex:1 1 auto;min-height:420px;width:100%;"></div>
    </section>
  </main>
<footer id="site-footer"><div class="flex w-full items-center justify-between px-4 py-4"><span class="brand-logo-text" style="font-size:13px;letter-spacing:1.5px;">Noah Trading Desk</span><p style="font-size:12px;color:var(--muted);">모의투자·OpenAPI 실습</p></div></footer>
<script src="/js/config.js"></script>
<script src="/js/common.js?v=20260925-terminal"></script>
<script src="/js/trade-history.js?v=20260925-terminal"></script>
</body>
</html>
