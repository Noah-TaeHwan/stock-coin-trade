<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>API 사용이력 — Noah Trading Desk</title><link rel="icon" type="image/svg+xml" href="/img/favicon.svg"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="/css/style.css?v=20260925-terminal"><script src="https://cdn.jsdelivr.net/npm/ag-grid-community@36.0.2/dist/ag-grid-community.min.js"></script><style>
    .usage-grid{--ag-font-size:12px;}.usage-grid .ag-header-cell-label{font-weight:800}.usage-grid .ag-cell{display:flex;align-items:center}
  </style></head><body><div id="header-mount"></div><main class="usage-history term-page">
    <header class="term-pagehead"><span class="term-code">USAGE</span><h1>API 사용이력</h1><p>KIS·KB증권·Alpaca·Binance·Korbit·AWS SSM 테스트 호출의 시간, 결과, 응답을 안전하게 확인합니다.</p><span class="term-right"><button id="usageRefresh" class="term-btn usage-refresh" type="button">↻ 새로고침</button></span></header>
    <div class="term-toolbar"><input id="usageFilter" type="search" placeholder="제공사 · API 경로 · 성공/실패 검색"><span id="usageStatus">불러오는 중…</span></div>
    <div class="term-layout term-layout--log">
      <section class="term-panel">
        <div class="term-panel__bar"><span class="term-code">LOG</span>테스트 호출 목록<span class="term-sub">행을 누르면 오른쪽에 상세 표시</span></div>
        <div id="usageGrid" class="usage-grid" style="flex:1 1 auto;min-height:420px;width:100%;"></div>
      </section>
      <section class="term-panel">
        <div class="term-panel__bar"><span class="term-code">RAW</span>선택한 호출의 안전한 응답 상세</div>
        <pre id="usageDetail" class="term-console detail" style="flex:1 1 auto;border:0;">표에서 행을 선택하면 요청 메타데이터와 마스킹된 응답 결과를 표시합니다.</pre>
      </section>
    </div>
  </main><script src="/js/config.js"></script><script src="/js/common.js?v=20260925-terminal"></script><script src="/js/api-usage-history.js?v=20260925-terminal"></script></body></html>
