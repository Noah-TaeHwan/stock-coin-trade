<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>에러분석 — 모의투자 — Noah Trading Desk</title><link rel="icon" type="image/svg+xml" href="/img/favicon.svg"><script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css?v=20260925-terminal">
  
  <style>
    .filters label{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;font-weight:700}
    .logs{width:100%;border-collapse:collapse;font-size:12.5px}.logs th,.logs td{padding:4px 8px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}.logs th{position:sticky;top:0;background:var(--surface-2);font-size:11px;color:var(--muted);white-space:nowrap}.logs td:first-child{font-family:var(--font-mono);white-space:nowrap}.logs tr{cursor:pointer}.logs tbody tr:hover{background:var(--surface-3)}
    .path,.message{max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tag{display:inline-block;padding:0 5px;border:1px solid var(--border-strong);border-radius:var(--radius-xs);background:var(--surface-2);font-family:var(--font-mono);font-weight:800;font-size:11px}
    .modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:15px;background:rgba(0,0,0,.7)}.modal.open{display:flex}
    .modal .detail{width:min(860px,100%);max-height:90vh;overflow:auto;padding:12px 14px;border:1px solid var(--border-strong);border-top:2px solid var(--accent);background:var(--surface)}
    .modal .detail pre{margin:4px 0 0;padding:8px 10px;overflow:auto;background:var(--bg);color:var(--fg-2);font:12px/1.55 var(--font-mono);white-space:pre-wrap}
    .modal .detail dt{margin-top:8px;font-size:11px;font-weight:800;color:var(--accent);font-family:var(--font-mono)}.modal .detail dd{margin:2px 0;color:var(--fg);font-size:12.5px;line-height:1.6}
    .modal .btn{padding:4px 10px;border:1px solid var(--accent);border-radius:var(--radius-xs);background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:800;cursor:pointer}
    @media(max-width:700px){.logs th:nth-child(4),.logs td:nth-child(4),.logs th:nth-child(5),.logs td:nth-child(5){display:none}}
  </style>
</head>
<body><div id="header-mount"></div><main class="wrap term-page">
    <header class="term-pagehead"><span class="term-code">ERR</span><h1>에러분석</h1><p>서버 API 실패와 브라우저 JavaScript 오류를 한 곳에서 확인합니다. 행을 선택하면 원인 설명, 요청 정보와 마스킹된 스택을 볼 수 있습니다.</p><span class="term-right"><span class="badge badge-red">ADMIN ONLY</span></span></header>
    <div class="term-toolbar filters">
      <label>발생 주체 <select id="source"><option value="">전체</option><option value="SERVER">서버</option><option value="CLIENT">브라우저</option></select></label>
      <label>HTTP 상태 <input id="status" inputmode="numeric" placeholder="예: 500" maxlength="3" style="width:80px;"></label>
      <button class="term-btn term-btn-primary" id="reload">새로고침</button>
      <span id="summary"></span>
    </div>
    <div class="notice" style="margin:0;">이 화면은 관리자 전용입니다. 비밀번호·세션 쿠키·API 키·Bearer 토큰은 저장 전에 마스킹합니다. 오류를 해결한 뒤에도 진단 로그는 자동 삭제되지 않습니다.</div>
    <section class="term-panel term-fill" style="min-height:420px;">
      <div class="term-panel__bar"><span class="term-code">LOG</span>진단 로그<span class="term-sub">최근 200건 · 행을 누르면 원인·요청·스택 상세</span></div>
      <div class="term-panel__body">
        <table class="logs"><thead><tr><th>발생 시각</th><th>주체</th><th>상태</th><th>경로</th><th>오류 유형</th><th>메시지</th></tr></thead><tbody id="rows"><tr><td colspan="6" style="text-align:center;color:var(--muted)">로그를 불러오는 중…</td></tr></tbody></table>
      </div>
    </section>
  </main><div id="modal" class="modal" role="dialog" aria-modal="true"><article class="detail"><div style="display:flex;justify-content:space-between;gap:12px"><h2 style="margin:0;font-size:15px;font-weight:800">오류 상세</h2><button class="btn" id="close">닫기</button></div><dl id="detail"></dl></article></div>
<script src="/js/config.js"></script><script src="/js/common.js?v=20260925-terminal"></script><script src="/js/error-analysis.js?v=20260925-terminal"></script></body></html>
