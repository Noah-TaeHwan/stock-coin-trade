<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>KIS API 호출 이력 — Noah Trading Desk</title>
  <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css?v=20260924-terminal">
  <script src="https://cdn.jsdelivr.net/npm/ag-grid-community@36.0.2/dist/ag-grid-community.min.js"></script>
  <style>
    .kis-grid{--ag-font-size:12px;}.kis-grid .ag-header-cell-label{font-weight:800}.kis-grid .ag-cell{display:flex;align-items:center}
  </style>
</head>
<body>
  <div id="header-mount"></div>
  <main class="kis-history term-page">
    <header class="term-pagehead"><span class="term-code">KIS</span><h1>KIS API 호출·오류 이력</h1><p>브라우저가 호출한 자체 API와, 공통 게이트웨이가 KIS Testbed에 보낸 실제 TR 요청을 함께 표시합니다. 키·토큰·전체 계좌번호는 저장 전에 마스킹됩니다.</p><span class="term-right"><button id="refresh" class="term-btn" type="button">↻ 새로고침</button></span></header>
    <div class="term-kpis"><div><small>전체 기록</small><b id="total">0</b></div><div><small>KIS 외부 호출</small><b id="outbound">0</b></div><div class="ok"><small>외부 호출 성공</small><b id="success">0</b></div><div class="fail"><small>외부 호출 실패</small><b id="failure">0</b></div><div><small>평균 응답시간</small><b id="average">-</b></div></div>
    <div class="term-toolbar"><input id="filter" type="search" placeholder="TR ID · 경로 · 작업 · 오류 메시지 검색">
        <select id="layer"><option value="">전체 계층</option><option value="내 API">내 API</option><option value="KIS 외부 호출">KIS 외부 호출</option></select>
        <select id="result"><option value="">전체 결과</option><option value="success">성공</option><option value="failure">실패</option></select>
        <span id="status">불러오는 중…</span></div>
    <div class="term-layout term-layout--log">
      <section class="term-panel">
        <div class="term-panel__bar"><span class="term-code">LOG</span>호출 목록<span class="term-sub">행을 누르면 오른쪽에 상세 표시</span></div>
        <div id="grid" class="kis-grid" style="flex:1 1 auto;min-height:420px;width:100%;"></div>
      </section>
      <section class="term-panel">
        <div class="term-panel__bar"><span class="term-code">RAW</span>선택한 호출 상세</div>
        <pre id="detail" class="term-console detail" style="flex:1 1 auto;border:0;">행을 선택하면 마스킹된 요청·응답을 표시합니다.</pre>
      </section>
    </div>
  </main>
  <script src="/js/config.js"></script><script src="/js/common.js?v=20260924-terminal"></script><script src="/js/kis-api-history.js?v=20260924-terminal"></script>
</body>
</html>
