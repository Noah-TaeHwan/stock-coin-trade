<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>지식 데이터셋 — 모의투자 — Noah Trading Desk</title><script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css?v=20260926-consent"><style>
    .term-form{display:grid;gap:6px}.term-form :is(input,select,textarea){width:100%;margin:0;padding:5px 8px;border:1px solid var(--border-strong);border-radius:var(--radius-xs);background:var(--bg);color:var(--fg);font:inherit;font-size:12.5px}.term-form :is(input,select){height:28px;padding-top:0;padding-bottom:0}.term-form textarea{resize:vertical;line-height:1.55}.term-form label{color:var(--muted);font-size:11px;font-weight:700}#qdrant-doc-list{max-height:calc(100dvh - 220px);overflow:auto}.term-panel__bar .term-btn{height:20px;text-transform:none;letter-spacing:0}
  </style></head><body><div id="header-mount"></div><main class="wide term-page">
    <header class="term-pagehead"><span class="term-code">DSET</span><h1>지식 데이터셋</h1><p>Qdrant 컬렉션 상태, 지식 문서 목록과 추가 기능을 관리합니다.</p></header>
    <div class="term-layout term-layout--tool">
      <div class="term-stack term-rail">
        <section class="term-panel">
          <div class="term-panel__bar"><span class="term-code">STAT</span>컬렉션 상태</div>
          <div id="qdrant-stats-body" class="term-panel__body--pad">불러오는 중…</div>
        </section>
        <section class="term-panel">
          <div class="term-panel__bar"><span class="term-code">ADD</span>새 지식 추가</div>
          <div class="term-panel__body--pad term-form">
            <input id="new-doc-title" placeholder="제목">
            <select id="new-doc-category"><option value="technical_analysis">기술분석</option><option value="fundamental_analysis">기본분석</option><option value="sector_analysis">섹터분석</option><option value="market_structure">시장구조</option><option value="investment_strategy">투자전략</option><option value="risk_management">리스크 관리</option><option value="custom">기타</option></select>
            <textarea id="new-doc-text" rows="8" placeholder="지식 내용 (최대 2000자)"></textarea>
            <button id="add-doc-btn" class="term-btn term-btn-primary btn" onclick="addQdrantDoc()">Qdrant에 추가</button>
            <div id="add-doc-msg"></div>
          </div>
        </section>
      </div>
      <section class="term-panel">
        <div class="term-panel__bar"><span class="term-code">DOCS</span>지식 문서 목록<span class="term-right"><button class="term-btn" onclick="loadDataset()">새로고침</button></span></div>
        <div id="qdrant-doc-list" class="term-panel__body--pad">불러오는 중…</div>
      </section>
    </div>
  </main><script src="/js/config.js"></script><script src="/js/common.js?v=20260925-terminal"></script><script>document.addEventListener('DOMContentLoaded',async()=>{await initPage();loadDataset()})</script></body></html>
