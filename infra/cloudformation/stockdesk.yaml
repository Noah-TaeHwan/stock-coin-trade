AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Noah Trading Desk public demo: one EC2 host running the Compose stack
  (docker-compose.yml + compose.public.yml + compose.edge.yml + compose.aws.yml),
  ECR repositories, a release/backup bucket, CloudWatch Logs, a monthly budget alert,
  and a GitHub Actions OIDC role that can only push images and run the deploy script.
  No SSH: the security group opens 80/443 only and operators use Session Manager.

Parameters:
  InstanceType:
    Type: String
    Default: t3.medium
    AllowedValues: [t3.small, t3.medium, t3.large]
    Description: >-
      Measured locally (2026-09-25): the stack uses ~0.35 GiB, ~1.0 GiB once the
      knowledge-search embedding model is loaded. t3.medium (4 GiB) leaves room for
      MariaDB/PostgreSQL growth; t3.small (2 GiB) works with the swap file.
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Latest Amazon Linux 2023 (SSM Agent preinstalled).
  RootVolumeGiB:
    Type: Number
    Default: 20
    MinValue: 10
    MaxValue: 100
  DataVolumeGiB:
    Type: Number
    Default: 30
    MinValue: 20
    MaxValue: 500
    Description: Holds /var/lib/docker (images and the MariaDB/PostgreSQL/Caddy volumes).
  GitHubRepository:
    Type: String
    Default: Noah-TaeHwan/stock-coin-trade
    AllowedPattern: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"
  GitHubEnvironment:
    Type: String
    Default: production
    Description: Only workflow jobs running in this GitHub environment can assume the deploy role.
  CreateGitHubOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Set to false if the account already has the token.actions.githubusercontent.com provider.
  ExistingGitHubOidcProviderArn:
    Type: String
    Default: ""
    Description: Required when CreateGitHubOidcProvider is false.
  BudgetEmail:
    Type: String
    AllowedPattern: "^[^@\\s]+@[^@\\s]+$"
    Description: Receives the monthly budget alerts.
  MonthlyBudgetUsd:
    Type: Number
    Default: 30
    MinValue: 1
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [7, 14, 30, 60, 90, 180, 365]
  ParameterPath:
    Type: String
    Default: /stock-coin-trade/prod
    AllowedPattern: "^/[A-Za-z0-9_./-]+[^/]$"
    Description: SSM Parameter Store path holding the app's secrets (SecureString), read by deploy.sh.

Conditions:
  CreateOidcProvider: !Equals [!Ref CreateGitHubOidcProvider, "true"]

Resources:
  # ── Network ───────────────────────────────────────────────────────────────
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.40.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags: [{Key: Name, Value: !Sub "${AWS::StackName}-vpc"}]

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.40.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags: [{Key: Name, Value: !Sub "${AWS::StackName}-public"}]

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTP and HTTPS only (no SSH; use Session Manager)
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: "HTTP (ACME and redirect)"}
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: HTTPS}
        - {IpProtocol: udp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: HTTP/3}
      SecurityGroupEgress:
        - {IpProtocol: "-1", CidrIp: 0.0.0.0/0, Description: "Updates, ECR, SSM, ACME, Anthropic API"}

  # ── Images, releases, logs ────────────────────────────────────────────────
  FrontendRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: stock-coin-trade-frontend
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: {ScanOnPush: true}
      EncryptionConfiguration: {EncryptionType: AES256}
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"keep the last 20 images",
          "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":20},
          "action":{"type":"expire"}}]}

  BackendRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: stock-coin-trade-python-backend
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: {ScanOnPush: true}
      EncryptionConfiguration: {EncryptionType: AES256}
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"keep the last 20 images",
          "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":20},
          "action":{"type":"expire"}}]}

  ReleaseBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
      VersioningConfiguration: {Status: Enabled}
      LifecycleConfiguration:
        Rules:
          - {Id: expire-releases, Status: Enabled, Prefix: releases/, ExpirationInDays: 90}
          - {Id: expire-backups, Status: Enabled, Prefix: backups/, ExpirationInDays: 35}
          - {Id: old-versions, Status: Enabled, NoncurrentVersionExpiration: {NoncurrentDays: 7}}

  ReleaseBucketTlsOnly:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ReleaseBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt ReleaseBucket.Arn, !Sub "${ReleaseBucket.Arn}/*"]
            Condition: {Bool: {"aws:SecureTransport": "false"}}

  AppLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/${AWS::StackName}/app"
      RetentionInDays: !Ref LogRetentionDays

  # ── Host ──────────────────────────────────────────────────────────────────
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - {Effect: Allow, Principal: {Service: ec2.amazonaws.com}, Action: sts:AssumeRole}
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore"
      Policies:
        - PolicyName: stockdesk-host
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EcrLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: EcrPull
                Effect: Allow
                Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer, ecr:BatchCheckLayerAvailability]
                Resource: [!GetAtt FrontendRepository.Arn, !GetAtt BackendRepository.Arn]
              - Sid: ContainerLogs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${AppLogGroup.Arn}:*"
              - Sid: AppSecrets
                Effect: Allow
                Action: [ssm:GetParametersByPath, ssm:GetParameter, ssm:GetParameters]
                Resource:
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParameterPath}"
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParameterPath}/*"
              - Sid: ReleasesAndBackups
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: [!Sub "${ReleaseBucket.Arn}/releases/*", !Sub "${ReleaseBucket.Arn}/backups/*"]

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  Host:
    Type: AWS::EC2::Instance
    DependsOn: GatewayAttachment
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds: [!Ref WebSecurityGroup]
      # IMDSv2 only. Hop limit 1: secrets reach containers through the env file deploy.sh
      # writes on the host, and awslogs runs in the host's Docker daemon, so containers
      # never need the metadata service.
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: {VolumeSize: !Ref RootVolumeGiB, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true}
      Tags: [{Key: Name, Value: !Sub "${AWS::StackName}-host"}]
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          dnf install -y docker
          # /var/lib/docker lives on the separate data volume, so database volumes survive an
          # instance replacement (for example when a stack update resolves a newer AMI).
          # NVMe serial = the EBS volume id without the hyphen.
          SERIAL=$(echo "${DataVolume}" | tr -d -)
          DEV=""
          for _ in $(seq 1 120); do
            DEV=$(lsblk -dno NAME,SERIAL | awk -v s="$SERIAL" '$2 == s {print "/dev/" $1}')
            [ -n "$DEV" ] && break
            sleep 5
          done
          [ -n "$DEV" ] || { echo "data volume ${DataVolume} not attached" >&2; exit 1; }
          blkid "$DEV" >/dev/null || mkfs.xfs -L stockdesk-data "$DEV"
          install -d /var/lib/docker
          grep -q stockdesk-data /etc/fstab || echo "LABEL=stockdesk-data /var/lib/docker xfs defaults,nofail 0 2" >> /etc/fstab
          mount -a
          systemctl enable --now docker
          # Docker Compose v2.40.3 plugin, verified against the release's checksums.txt.
          install -d /usr/local/lib/docker/cli-plugins
          curl -fsSL -o /usr/local/lib/docker/cli-plugins/docker-compose \
            https://github.com/docker/compose/releases/download/v2.40.3/docker-compose-linux-x86_64
          echo "dba9d98e1ba5bfe11d88c99b9bd32fc4a0624a30fafe68eea34d61a3e42fd372  /usr/local/lib/docker/cli-plugins/docker-compose" | sha256sum -c -
          chmod 755 /usr/local/lib/docker/cli-plugins/docker-compose
          # 1 GiB swap as headroom for the embedding model on small instances.
          if [ ! -f /swapfile ]; then
            dd if=/dev/zero of=/swapfile bs=1M count=1024
            chmod 600 /swapfile
            mkswap /swapfile
            swapon /swapfile
            echo "/swapfile swap swap defaults 0 0" >> /etc/fstab
          fi
          install -d -m 700 /opt/stockdesk /opt/stockdesk/releases

  DataVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      AvailabilityZone: !Select [0, !GetAZs ""]
      Size: !Ref DataVolumeGiB
      VolumeType: gp3
      Encrypted: true
      Tags: [{Key: Name, Value: !Sub "${AWS::StackName}-data"}]

  DataVolumeAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      InstanceId: !Ref Host
      VolumeId: !Ref DataVolume
      Device: /dev/sdf

  PublicAddress:
    Type: AWS::EC2::EIP
    DependsOn: GatewayAttachment
    Properties:
      Domain: vpc
      InstanceId: !Ref Host

  # ── Cost guard ────────────────────────────────────────────────────────────
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub "${AWS::StackName}-monthly"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: {Amount: !Ref MonthlyBudgetUsd, Unit: USD}
      NotificationsWithSubscribers:
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref BudgetEmail}]
        - Notification: {NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref BudgetEmail}]

  # ── CI deploy identity (GitHub Actions OIDC) ──────────────────────────────
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If [CreateOidcProvider, !Ref GitHubOidcProvider, !Ref ExistingGitHubOidcProviderArn]
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubRepository}:environment:${GitHubEnvironment}"
      Policies:
        - PolicyName: stockdesk-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EcrLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: EcrPush
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:BatchGetImage
                  - ecr:DescribeImages
                  - ecr:DescribeImageScanFindings
                Resource: [!GetAtt FrontendRepository.Arn, !GetAtt BackendRepository.Arn]
              - Sid: UploadRelease
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${ReleaseBucket.Arn}/releases/*"
              - Sid: RunDeployOnHost
                Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript"
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Host}"
              - Sid: ReadDeployResult
                Effect: Allow
                Action: [ssm:GetCommandInvocation, ssm:ListCommandInvocations]
                Resource: "*"

Outputs:
  InstanceId:
    Value: !Ref Host
  PublicIp:
    Description: Point the domain's A record here, then set SITE_ADDRESS to the domain.
    Value: !Ref PublicAddress
  EcrRegistry:
    Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com"
  ReleaseBucketName:
    Value: !Ref ReleaseBucket
  LogGroupName:
    Value: !Ref AppLogGroup
  DeployRoleArn:
    Description: Store as the AWS_DEPLOY_ROLE_ARN variable of the GitHub environment.
    Value: !GetAtt DeployRole.Arn
